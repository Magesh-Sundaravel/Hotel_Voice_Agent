[project]
name = "hotel-voice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.0"
dependencies = [
    "aiosmtplib>=5.1.3",
    "fastapi>=0.161.0",
    "groq>=0.37.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.16.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "ruff>=0.17.2",
    "supabase>=2.33.0",
    "twilio>=9.12.0",
    "uvicorn>=0.54.0",
    "webrtcvad-wheels>=2.0.14.post1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:supabase.*",
]
markers = [
    "eval: LLM evaluation tests (require GROQ_API_KEY)",
]
addopts = "-m 'not eval'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
